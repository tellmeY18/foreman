version: '3.8'

services:
  db:
    image: ${POSTGRES_IMAGE}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z ${DB_HEALTHCHECK_HOST} ${DB_HEALTHCHECK_PORT} || exit 1"]
      interval: ${DB_HEALTHCHECK_INTERVAL}
      timeout: ${DB_HEALTHCHECK_TIMEOUT}
      retries: ${DB_HEALTHCHECK_RETRIES}
    volumes:
      - type: bind
        source: ./data/db
        target: /var/lib/postgresql/data
        is_directory: true

  redis-cache:
    image: ${REDIS_CACHE_IMAGE}

  redis-tasks:
    image: ${REDIS_TASKS_IMAGE}
    command: ${REDIS_TASKS_COMMAND}
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
        is_directory: true

  app: &app_base
    image: ${FOREMAN_IMAGE}
    build:
      context: .
    command: ${APP_COMMAND}
    depends_on:
      - db
      - redis-cache
      - redis-tasks
    # expose only the container port; Coolify proxy will handle host routing
    expose:
      - "${APP_HTTP_PORT}"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.foreman.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.foreman.entryPoints=http,https"
      - "traefik.http.services.foreman.loadbalancer.server.port=${APP_HTTP_PORT}"

  orchestrator:
    <<: *app_base
    command: ${ORCHESTRATOR_COMMAND}

  worker:
    <<: *app_base
    command: ${WORKER_COMMAND}

# no top-level volumes section needed when using host binds
